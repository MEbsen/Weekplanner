name: Refactor cleanup

on:
  push:
    branches:
      - cleanup/legacy-scroll-dev16
    paths:
      - scripts/refactor_legacy_scroll.py
      - .github/workflows/refactor-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/legacy-scroll-dev16
      - name: Run cleanup and capture diagnostics
        run: |
          set +e
          python scripts/refactor_legacy_scroll.py > refactor-cleanup.log 2>&1
          echo $? > refactor-cleanup.exit
          cat refactor-cleanup.log
          exit 0
      - name: Verify syntax when cleanup succeeded
        run: |
          if [ "$(cat refactor-cleanup.exit)" = "0" ]; then
            node --check custom_components/week_planner/frontend/week-planner-core.js
            node --check custom_components/week_planner/frontend/services/scroll-controller.js
            node --check custom_components/week_planner/frontend/services/scroll-integration.js
          fi
      - name: Commit result and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/week_planner/frontend/week-planner-core.js refactor-cleanup.log refactor-cleanup.exit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply legacy scroll cleanup"
          git push origin HEAD:cleanup/legacy-scroll-dev16
