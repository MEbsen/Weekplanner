name: Resource hotfix dev21
on:
  push:
    branches: [hotfix/resource-dev21]
    paths:
      - scripts/hotfix_resource_dev21.py
      - .github/workflows/hotfix-resource-dev21.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/resource-dev21
      - run: python scripts/hotfix_resource_dev21.py
      - run: python -m py_compile custom_components/week_planner/__init__.py
      - run: node --check custom_components/week_planner/frontend/week-planner.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/week_planner/__init__.py custom_components/week_planner/const.py custom_components/week_planner/manifest.json custom_components/week_planner/frontend/week-planner.js
          git commit -m "Fix Lovelace resource lifecycle for dev.21"
          git push origin HEAD:hotfix/resource-dev21
