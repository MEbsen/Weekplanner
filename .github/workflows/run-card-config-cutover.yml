name: Run card config cutover
on:
  push:
    branches: [dev]
    paths: [.github/workflows/run-card-config-cutover.yml]
permissions:
  contents: write
jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-data-config-dev26
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/remove_card_data_overlay.py
      - run: node --check custom_components/week_planner/frontend/week-planner-core.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/week_planner/frontend/week-planner-core.js
          git diff --cached --quiet || git commit -m "Remove parallel card data configuration"
          git push origin HEAD:refactor/shared-data-config-dev26
